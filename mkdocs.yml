site_name: ARC Framework
site_url: https://andrewrcr.github.io/arc-framework/
repo_url: https://github.com/andrewRCr/arc-framework
repo_name: andrewRCr/arc-framework

theme:
  name: material
  custom_dir: docs/overrides
  favicon: img/favicon.ico
  features:
    - navigation.indexes
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

not_in_nav: |
  /demos/**

nav:
  - Overview: index.md
  - Getting Started: getting-started.md
  - Methodology:
    - methodology/index.md
    - Rationale: methodology/rationale.md
    - Principles: methodology/principles.md
  - The Framework: the-framework.md
  - Work Planning: work-planning.md
  - Customization:
    - customization/index.md
    - Configuration: customization/configuration.md
    - Methods & Extensions: customization/methods.md
    - Agent Hooks: customization/hooks.md
  - Reference:
    - reference/index.md
    - Updating: reference/updating.md
    - Quality Gates: reference/quality-gates.md
    - Work Organization: reference/work-organization.md
    - Sessions & Context: reference/sessions.md
    - Skills: reference/skills.md
    - Team Coordination: reference/team-coordination.md
    - Task Lists: reference/task-lists.md
    - Glossary: reference/glossary.md
  - FAQ: faq.md
  - Contributing: contributing.md

plugins:
  - search
  - glightbox:
      auto_themed: true
      auto_caption: true
      touchNavigation: true
      effect: zoom

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
