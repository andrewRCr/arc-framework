site_name: ARC Framework
site_url: https://andrewrcr.github.io/arc-framework/
repo_url: https://github.com/andrewRCr/arc-framework
repo_name: andrewRCr/arc-framework

theme:
  name: material
  logo: img/arc-logo.svg
  favicon: img/favicon.ico
  features:
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - How ARC Works: how-arc-works.md
  - Philosophy: philosophy.md
  - Work Planning: work-planning.md
  - Updating ARC: updating.md
  - Reference:
    - reference/index.md
    - Configuration: reference/configuration.md
    - Quality Gates: reference/quality-gates.md
    - Skills: reference/skills.md
    - Team Coordination: reference/team-coordination.md
    - Glossary: reference/glossary.md
  - FAQ: faq.md
  - Contributing: contributing.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
