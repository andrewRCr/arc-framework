name: Review Gate Attest

on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number
        required: true
        type: number
      payload:
        description: Strict neutral attestation JSON
        required: true
        type: string

permissions:
  contents: read

jobs:
  attest:
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    environment: review-gate
    concurrency:
      group: review-gate-${{ github.event.repository.id }}-${{ inputs.pull_request }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.ARC_REVIEW_GATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.ARC_REVIEW_GATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-checks: read
          permission-pull-requests: write
      - env:
          ARC_REVIEW_GATE_APP_ID: ${{ vars.ARC_REVIEW_GATE_APP_ID }}
          ARC_APP_TOKEN: ${{ steps.app-token.outputs.token }}
          ARC_APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          ARC_DISPATCH_ACTOR_ID: ${{ github.actor_id }}
          GITHUB_TOKEN: ${{ github.token }}
        run: ./node_modules/.bin/tsx packages/arc-framework/src/scripts/review-gate/run-attest.ts
