name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * 1'

# Least-privilege default for the whole workflow: every job only reads the repo.
# Any job that later needs more requests it explicitly.
permissions:
  contents: read

# Cancel superseded work within the same event/ref lane. Push and pull_request
# runs do not cancel each other; duplicate push runs skip downstream jobs after
# classification when an open PR already owns the same branch head.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Classify the change on two independent axes:
  #   lane   - merge policy (auto-merge vs reviewed). PR-only.
  #   weight - CI cost (light vs heavy), resolved by scripts/classify-change.sh:
  #            heavy when the change touches the canonical code surface and that
  #            exact code tree has not already passed the heavy suite; light for a
  #            docs-only change or an already-verified tree. A light run skips the
  #            code checks, the integration/e2e suite, and the portability matrix.
  # The axes are independent: a docs PR is reviewed-lane (no auto-merge) yet light.
  # ci-ok rolls up CI truth; merge-ok remains a thin compatibility alias.
  classify:
    name: Classify lane & weight
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
      pull-requests: read
    outputs:
      lane: ${{ steps.c.outputs.lane }}
      weight: ${{ steps.c.outputs.weight }}
      reason: ${{ steps.c.outputs.reason }}
      duplicate_push: ${{ steps.duplicate.outputs.duplicate_push }}
      portability_target: ${{ steps.c.outputs.portability_target }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: duplicate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          duplicate_push="$(bash scripts/classify-change.sh duplicate-push "$EVENT_NAME" "$REF_NAME" "$HEAD_SHA")"
          if [ "$duplicate_push" != 'true' ] && [ "$duplicate_push" != 'false' ]; then
            echo "::error::invalid duplicate-push output: $duplicate_push"
            exit 1
          fi
          echo "duplicate_push=$duplicate_push" >> "$GITHUB_OUTPUT"
          if [ "$duplicate_push" = 'true' ]; then
            {
              echo '### CI duplicate push'
              echo
              echo 'This push run is represented by an open pull request for the same branch head.'
              echo 'Downstream jobs are skipped; the pull_request run owns the merge signal.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - id: c
        if: ${{ steps.duplicate.outputs.duplicate_push != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
        run: |
          # changed_all - the whole change (PR base...head, or push delta) - drives
          # the lane (merge policy) decision below. The weight axis (CI cost) is
          # resolved by scripts/classify-change.sh, which derives its own change set
          # and fail-safes to heavy on any uncertainty.
          event="$EVENT_NAME"
          action="$EVENT_ACTION"

          if [ "$event" = 'pull_request' ]; then
            all_base='${{ github.event.pull_request.base.sha }}'
            all_head='${{ github.event.pull_request.head.sha }}'
          else
            all_base='${{ github.event.before }}'
            all_head='${{ github.sha }}'
          fi

          # Cross-platform runners are reserved for changes that can affect the
          # concurrency primitives. An unreadable PR diff fails safe to running
          # the matrix; non-PR events are dispatched explicitly below.
          portability_target=false
          if [ "$event" = 'pull_request' ]; then
            portability_target=true
            if git rev-parse -q --verify "$all_base^{commit}" >/dev/null 2>&1 \
               && git rev-parse -q --verify "$all_head^{commit}" >/dev/null 2>&1; then
              if ! portability_target="$(git diff --name-only -z "$all_base...$all_head" \
                | bash scripts/classify-change.sh portability --stdin0)"; then
                echo "::error::portability classifier failed"
                exit 1
              fi
              if [ "$portability_target" != 'true' ] && [ "$portability_target" != 'false' ]; then
                echo "::error::invalid portability classifier output: $portability_target"
                exit 1
              fi
            fi
          fi
          echo "portability_target=$portability_target" >> "$GITHUB_OUTPUT"
          lane=reviewed
          if git rev-parse -q --verify "$all_base^{commit}" >/dev/null 2>&1 \
             && git rev-parse -q --verify "$all_head^{commit}" >/dev/null 2>&1; then
            if [ "$event" = 'pull_request' ]; then
              lane="$(git diff --name-only -z "$all_base...$all_head" \
                | bash scripts/classify-change.sh lane --stdin0)"
            else
              lane="$(git diff --name-only -z "$all_base" "$all_head" \
                | bash scripts/classify-change.sh lane --stdin0)"
            fi
          fi

          # weight axis: delegate to the canonical classifier. It prints
          # `weight=` and `reason=` (GITHUB_OUTPUT lines) on stdout and a decision
          # line on stderr; the verified-tree lookback uses the ambient token
          # (checks: read) and runs only in live CI.
          weight_out="$(bash scripts/classify-change.sh decide "$event" "$all_base" "$all_head")"
          if ! printf '%s\n' "$weight_out" | awk '
            /^weight=(light|heavy)$/ { weight += 1; next }
            /^reason=(docs-only|verified|unverified)$/ { reason += 1; next }
            { bad = 1 }
            END { exit !(NR == 2 && weight == 1 && reason == 1 && bad != 1) }
          '; then
            echo "::error::invalid classifier output shape"
            printf '%s\n' "$weight_out"
            exit 1
          fi
          printf '%s\n' "$weight_out" >> "$GITHUB_OUTPUT"
          { echo '### CI classification'; echo; printf '%s\n' "$weight_out" | sed 's/^/- /'; } >> "$GITHUB_STEP_SUMMARY"

          # The legacy scheduling lane is PR-only; pushes remain reviewed.
          if [ "$event" != 'pull_request' ]; then lane=reviewed; fi
          echo "lane=$lane" >> "$GITHUB_OUTPUT"
          echo "classified lane=$lane (event=$event action=$action); see decide log above for weight"

  lint-typecheck:
    name: Lint & Typecheck
    permissions:
      contents: read
    needs: classify
    # Run after classification on every push and PR lane. The documentation /
    # ARC-doc linters always run; code checks additionally gate on weight
    # (fail-safe: run unless explicitly light).
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.classify.result == 'success' && needs.classify.outputs.duplicate_push != 'true' }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      with:
        persist-credentials: false
    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
      with:
        node-version: 'lts/*'
        cache: 'npm'
    - run: npm ci
    # Documentation / ARC-doc linters - relevant to docs and code alike; always run.
    - run: npm run lint:arc:triggers
    - run: npm run lint:arc:domain-rules
    - run: npm run lint:arc:section-refs
    - run: npm run -s lint:md
    # Code checks - only when the change touches code (weight != light).
    - if: ${{ needs.classify.outputs.weight != 'light' }}
      run: npm run build
    - if: ${{ needs.classify.outputs.weight != 'light' }}
      run: npm run lint:ts
    - if: ${{ needs.classify.outputs.weight != 'light' }}
      run: npm run lint:sh
    - if: ${{ needs.classify.outputs.weight != 'light' }}
      run: npm run typecheck
    - if: ${{ needs.classify.outputs.weight != 'light' }}
      run: npm run typecheck:test

  unit:
    name: Unit Tests
    permissions:
      contents: read
    needs: classify
    # Code-weight only: a light (docs-only or verified-tree) run skips the job
    # entirely, mirroring the integration/e2e legs.
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.classify.result == 'success' && needs.classify.outputs.duplicate_push != 'true' && needs.classify.outputs.weight != 'light' }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      with:
        persist-credentials: false
    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
      with:
        node-version: 'lts/*'
        cache: 'npm'
    - run: npm ci
    - run: npm run test:unit

  integration:
    name: Integration Tests
    permissions:
      contents: read
    needs: classify
    if: ${{ !cancelled() && ((github.event_name == 'pull_request' && needs.classify.outputs.lane == 'reviewed' && needs.classify.outputs.weight != 'light') || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      with:
        persist-credentials: false
    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
      with:
        node-version: 'lts/*'
        cache: 'npm'
    - run: npm ci
    - run: npm run build
    - run: npm run test:integration

  e2e:
    name: E2E Tests
    permissions:
      contents: read
    needs: classify
    if: ${{ !cancelled() && ((github.event_name == 'pull_request' && needs.classify.outputs.lane == 'reviewed' && needs.classify.outputs.weight != 'light') || github.event_name == 'workflow_dispatch') }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      with:
        persist-credentials: false
    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
      with:
        node-version: 'lts/*'
        cache: 'npm'
    - run: npm ci
    - run: npm run build
    - run: npm run test:e2e -w packages/arc-framework -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}
      env:
        ARC_E2E_SKIP_BUILD: '1'

  # Linux confirmation for the same-machine write-safety guards. The
  # exclusive-create (`wx`/`O_EXCL`), advisory-lock (`mkdir` + `process.kill`
  # liveness), and CAS primitives - and the bounded true-race smoke that spawns
  # real concurrent writers - are OS-sensitive in a way the ubuntu-only jobs
  # above can't confirm. This required PR leg stays on Linux; the costlier
  # Windows/macOS confirmation below runs only when its focused surface changes.
  portability:
    name: Portability (concurrency guards)
    permissions:
      contents: read
    needs: classify
    if: ${{ !cancelled() && ((github.event_name == 'pull_request' && needs.classify.outputs.lane == 'reviewed' && needs.classify.outputs.weight != 'light') || github.event_name == 'workflow_dispatch') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      with:
        persist-credentials: false
    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
      with:
        node-version: 'lts/*'
        cache: 'npm'
    - run: npm ci
    - run: npm run build
    - run: npm run test:portability
      env:
        ARC_E2E_SKIP_BUILD: '1'

  portability-cross-platform:
    name: Portability targeted
    permissions:
      contents: read
    needs: classify
    if: ${{ !cancelled() && ((github.event_name == 'pull_request' && needs.classify.outputs.lane == 'reviewed' && needs.classify.outputs.portability_target == 'true') || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      with:
        persist-credentials: false
    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
      with:
        node-version: 'lts/*'
        cache: 'npm'
    - run: npm ci
    - run: npm run build
    - run: npm run test:portability
      env:
        ARC_E2E_SKIP_BUILD: '1'

  ci_ok:
    name: ci-ok
    permissions: {}
    needs: [classify, lint-typecheck, unit, integration, e2e, portability, portability-cross-platform]
    if: ${{ always() && !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Roll up required jobs
        env:
          # Pass the whole needs graph as JSON (job id -> {result, outputs}) so the
          # rollup can name which job failed, not just that one did.
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          # Pass when every needed job succeeded OR was skipped; on failure, name
          # the offending job(s) so a red rollup is diagnosable from this check
          # alone, without opening each needed job's log.
          printf '%s' "$NEEDS_JSON" | jq -r 'to_entries[] | "needed job \(.key): \(.value.result)"'
          failed="$(printf '%s' "$NEEDS_JSON" \
            | jq -r 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key')"
          if [ -n "$failed" ]; then
            echo "::error::required job(s) did not succeed: $(printf '%s' "$failed" | paste -sd, -)"
            exit 1
          fi
          echo "ci-ok ✓ (lane=${{ needs.classify.outputs.lane }} weight=${{ needs.classify.outputs.weight }})"

  merge-ok:
    name: merge-ok
    permissions: {}
    needs: ci_ok
    if: ${{ always() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Mirror ci-ok for required-context compatibility
        env:
          CI_OK_RESULT: ${{ needs.ci_ok.result }}
        run: |
          if [ "$CI_OK_RESULT" != 'success' ]; then
            echo "::error::ci-ok did not succeed: $CI_OK_RESULT"
            exit 1
          fi
          echo 'merge-ok compatibility alias ✓'
