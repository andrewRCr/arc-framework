name: Documentation Quality CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  documentation-quality:
    name: Documentation Quality Checks
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Lint markdown files
      run: npx markdownlint-cli2 "**/*.md"

    - name: Validate template structure
      run: |
        echo "=== Validating template tokens ==="
        # Check that templates contain expected tokens
        find templates -name "*.template.md" -exec grep -L "{{.*}}" {} \; | while read file; do
          echo "WARNING: Template $file may be missing tokens"
        done

        echo "=== Validating file naming conventions ==="
        # Check naming conventions
        find .arc -name "*.example.md" -not -path "templates/*" | head -5
        find templates -name "*.template.md" | head -5
        find profiles -name "*.profile.md" | head -5

