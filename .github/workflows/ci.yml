name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # `ready_for_review` is deliberately absent. Draft pull requests already run
    # this workflow on `opened` and `synchronize`, so the flip re-tests a head
    # that is already green and changes no content. Under `merge.lock: draft`
    # every merge performs that flip, so listening to it would put the required
    # check back in flight at the moment the merge needs it — the release cannot
    # complete until a run it caused finishes. Projects that gate CI behind
    # non-draft status need the opposite choice and must not adopt this one
    # unchanged.
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      run_portability_pair:
        description: 'Also run the Windows/macOS portability pair (billed at hosted-runner multipliers)'
        type: boolean
        default: false
  # Weekly full-tier duration refresh and cross-platform portability. The pair fires only here or
  # on an explicit dispatch opt-in — never from PR synchronizes — so the weekly
  # cadence is a post-merge backstop against OS-specific concurrency-guard
  # regressions at a trivial cost (macOS bills 10×, but a single weekly firing is
  # a few billed minutes). classify still computes portability_target as the
  # relevance signal; the pair no longer consumes it.
  schedule:
    - cron: '17 8 * * 1'

# Least-privilege default for the whole workflow: every job only reads the repo.
# Any job that later needs more requests it explicitly.
permissions:
  contents: read

# Local Vitest runs keep their own 50% shared-machine default. In CI, an ordinary
# GitHub-hosted Linux runner uses native sizing; selecting a custom Linux runner
# defaults to one worker so multiple jobs and their CLI/Git subprocesses fit a
# constrained host. The repository variable can retune that fleet without a code
# change. An unbudgeted sizing mode receives an advisory warning, not a comparison.
env:
  VITEST_MAX_WORKERS: ${{ vars.ARC_CI_VITEST_MAX_WORKERS || (vars.ARC_CI_LINUX_RUNNER && '1') || '' }}

# Cancel superseded work for the same ref. Push and pull_request runs never
# cancel each other, because a branch ref and a pull-request merge ref are
# different groups.
# Duplicate push runs skip downstream jobs after classification when an open PR
# already owns the same branch head.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Classify the change on two independent axes:
  #   lane   - merge policy (auto-merge vs reviewed). PR-only.
  #   weight - CI cost (light vs heavy), resolved by scripts/classify-change.sh:
  #            heavy when the change touches the canonical code surface and the
  #            exact code tree this run tests has not already passed the heavy
  #            suite in this pull request; light for a docs-only change or an
  #            already-verified tree. A light run skips the code checks, the
  #            integration/e2e suite, and the portability leg.
  # The axes are independent: a docs PR is reviewed-lane (no auto-merge) yet light.
  # ci-ok rolls up CI truth; merge-ok remains a thin compatibility alias.
  classify:
    name: Classify lane & weight
    runs-on: ${{ vars.ARC_CI_LINUX_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
      pull-requests: read
    outputs:
      lane: ${{ steps.c.outputs.lane }}
      weight: ${{ steps.c.outputs.weight }}
      reason: ${{ steps.c.outputs.reason }}
      duplicate_push: ${{ steps.duplicate.outputs.duplicate_push }}
      portability_target: ${{ steps.c.outputs.portability_target }}
      tested_tree: ${{ steps.tested.outputs.tree }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      # classify-change hashes NUL-delimited tree records with Node. Provision it
      # explicitly because disposable runners do not carry a system Node install.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - id: duplicate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          duplicate_push="$(bash scripts/classify-change.sh duplicate-push "$EVENT_NAME" "$REF_NAME" "$HEAD_SHA")"
          if [ "$duplicate_push" != 'true' ] && [ "$duplicate_push" != 'false' ]; then
            echo "::error::invalid duplicate-push output: $duplicate_push"
            exit 1
          fi
          echo "duplicate_push=$duplicate_push" >> "$GITHUB_OUTPUT"
          if [ "$duplicate_push" = 'true' ]; then
            {
              echo '### CI duplicate push'
              echo
              echo 'This push run is represented by an open pull request for the same branch head.'
              echo 'Downstream jobs are skipped; the pull_request run owns the merge signal.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      # A pull-request run checks out GitHub's merge of the head into the current
      # base (`github.sha`), and every heavy job tests that same commit, so its
      # code tree is the tree this run verifies. The record-verified-tree job
      # saves a marker under this tree's key after a full heavy pass; finding one
      # here means an earlier run of this pull request already verified it. An
      # unhashable tree leaves nothing to look up, which keeps the run heavy.
      - id: tested
        if: ${{ github.event_name == 'pull_request' }}
        env:
          TESTED_SHA: ${{ github.sha }}
        run: |
          if tested_tree="$(bash scripts/classify-change.sh tree-hash "$TESTED_SHA")"; then
            echo "tree=$tested_tree" >> "$GITHUB_OUTPUT"
          fi
      - id: verified
        if: ${{ steps.tested.outputs.tree != '' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .ci-verified-tree
          key: ci-verified-tree-v1-pr${{ github.event.pull_request.number }}-${{ steps.tested.outputs.tree }}
          lookup-only: true
      - id: c
        if: ${{ steps.duplicate.outputs.duplicate_push != 'true' }}
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          TESTED_TREE_VERIFIED: ${{ steps.verified.outputs.cache-hit }}
        run: |
          # changed_all - the whole change (PR base...head, or push delta) - drives
          # the lane (merge policy) decision below. The weight axis (CI cost) is
          # resolved by scripts/classify-change.sh, which derives its own change set
          # and fail-safes to heavy on any uncertainty.
          event="$EVENT_NAME"
          action="$EVENT_ACTION"

          if [ "$event" = 'pull_request' ]; then
            all_base='${{ github.event.pull_request.base.sha }}'
            all_head='${{ github.event.pull_request.head.sha }}'
          else
            all_base='${{ github.event.before }}'
            all_head='${{ github.sha }}'
          fi

          # portability_target reports whether the change can affect the
          # concurrency primitives (an unreadable PR diff fails safe to true).
          # Informational on PRs: the Windows/macOS pair fires only on the
          # weekly schedule or an explicit dispatch opt-in.
          portability_target=false
          if [ "$event" = 'pull_request' ]; then
            portability_target=true
            if git rev-parse -q --verify "$all_base^{commit}" >/dev/null 2>&1 \
               && git rev-parse -q --verify "$all_head^{commit}" >/dev/null 2>&1; then
              if ! portability_target="$(git diff --name-only -z "$all_base...$all_head" \
                | bash scripts/classify-change.sh portability --stdin0)"; then
                echo "::error::portability classifier failed"
                exit 1
              fi
              if [ "$portability_target" != 'true' ] && [ "$portability_target" != 'false' ]; then
                echo "::error::invalid portability classifier output: $portability_target"
                exit 1
              fi
            fi
          fi
          echo "portability_target=$portability_target" >> "$GITHUB_OUTPUT"
          lane=reviewed
          if git rev-parse -q --verify "$all_base^{commit}" >/dev/null 2>&1 \
             && git rev-parse -q --verify "$all_head^{commit}" >/dev/null 2>&1; then
            if [ "$event" = 'pull_request' ]; then
              lane="$(git diff --name-only -z "$all_base...$all_head" \
                | bash scripts/classify-change.sh lane --stdin0)"
            else
              lane="$(git diff --name-only -z "$all_base" "$all_head" \
                | bash scripts/classify-change.sh lane --stdin0)"
            fi
          fi

          # weight axis: delegate to the canonical classifier. It prints
          # `weight=` and `reason=` (GITHUB_OUTPUT lines) on stdout and a decision
          # line on stderr; only a `true` tested-tree lookup above lets a
          # code-touching pull request run light.
          weight_out="$(bash scripts/classify-change.sh decide "$event" "$all_base" "$all_head" "$TESTED_TREE_VERIFIED")"
          if ! printf '%s\n' "$weight_out" | awk '
            /^weight=(light|heavy)$/ { weight += 1; next }
            /^reason=(docs-only|verified|unverified)$/ { reason += 1; next }
            { bad = 1 }
            END { exit !(NR == 2 && weight == 1 && reason == 1 && bad != 1) }
          '; then
            echo "::error::invalid classifier output shape"
            printf '%s\n' "$weight_out"
            exit 1
          fi
          printf '%s\n' "$weight_out" >> "$GITHUB_OUTPUT"
          { echo '### CI classification'; echo; printf '%s\n' "$weight_out" | sed 's/^/- /'; } >> "$GITHUB_STEP_SUMMARY"

          # The legacy scheduling lane is PR-only; pushes remain reviewed.
          if [ "$event" != 'pull_request' ]; then lane=reviewed; fi
          echo "lane=$lane" >> "$GITHUB_OUTPUT"
          echo "classified lane=$lane (event=$event action=$action); see decide log above for weight"

  # Forecast and duration input shared by every check job.
  setup:
    name: Shared setup
    permissions:
      contents: read
      actions: write # upload-artifact under workflow-level contents-only defaults
    needs: classify
    if: ${{ !cancelled() && needs.classify.result == 'success' && needs.classify.outputs.duplicate_push != 'true' }}
    runs-on: ${{ vars.ARC_CI_LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
    - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
      with:
        node-version: 'lts/*'
        cache: 'npm'
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      id: nm-cache
      with:
        path: |
          node_modules
          packages/arc-framework/node_modules
        key: ${{ runner.os }}-${{ runner.arch }}-nm-${{ hashFiles('package-lock.json') }}
    - if: ${{ steps.nm-cache.outputs.cache-hit != 'true' }}
      run: npm ci
    - name: Resolve local base branch
      run: git show-ref --verify --quiet refs/heads/main || git branch main origin/main
    - name: Forecast merge checks
      id: forecast
      run: |
        node --import tsx packages/arc-framework/src/cli.ts check gate merge --ci --dry-run --json > "$RUNNER_TEMP/arc-check-forecast.json"
        mv "$RUNNER_TEMP/arc-check-forecast.json" .arc-check-forecast.json
    - name: Validate check plumbing
      run: node --import tsx scripts/run-ci-checks.mjs validate
    - name: Upload check forecast
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: arc-check-forecast
        path: .arc-check-forecast.json
        include-hidden-files: true
        if-no-files-found: error

    - name: Restore duration cache
      id: duration-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: packages/arc-framework/.test-cost-runs/duration-input
        key: arc-test-durations-Linux-${{ github.run_id }}
        restore-keys: arc-test-durations-Linux-
    - name: Prepare duration input
      run: node --import tsx packages/arc-framework/__tests__/helpers/prepare-duration-input.ts packages/arc-framework/.test-cost-runs/duration-input
    - name: Upload duration input
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: test-duration-input
        path: packages/arc-framework/.test-cost-runs/duration-input/
        include-hidden-files: true
        if-no-files-found: error

  build:
    name: Build
    permissions:
      contents: read
      actions: write
    needs: [classify, setup]
    if: ${{ !cancelled() && needs.classify.result == 'success' && needs.classify.outputs.duplicate_push != 'true' && (needs.classify.outputs.weight != 'light' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && needs.setup.result == 'success' }}
    runs-on: ${{ vars.ARC_CI_LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
    - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      with:
        persist-credentials: false
    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
      with:
        node-version: 'lts/*'
        cache: 'npm'
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      id: nm-cache
      with:
        path: |
          node_modules
          packages/arc-framework/node_modules
        key: ${{ runner.os }}-${{ runner.arch }}-nm-${{ hashFiles('package-lock.json') }}
    - if: ${{ steps.nm-cache.outputs.cache-hit != 'true' }}
      run: npm ci
    - name: Download check forecast
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: arc-check-forecast
        path: .
    - id: build
      run: node --import tsx scripts/run-ci-checks.mjs run build build
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: arc-framework-dist
        path: packages/arc-framework/dist/
        retention-days: 1

  lint-typecheck:
    name: Lint & Typecheck
    permissions:
      contents: read
      actions: read # download-artifact of shared dist
    needs: [classify, setup, build]
    # Documentation and default checks run on light and heavy push/PR runs.
    # The shared build is optional when the classifier selected light weight.
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.classify.result == 'success' && needs.classify.outputs.duplicate_push != 'true' && needs.setup.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ${{ vars.ARC_CI_LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
    - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
      with:
        node-version: 'lts/*'
        cache: 'npm'
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      id: nm-cache
      with:
        path: |
          node_modules
          packages/arc-framework/node_modules
        key: ${{ runner.os }}-${{ runner.arch }}-nm-${{ hashFiles('package-lock.json') }}
    - if: ${{ steps.nm-cache.outputs.cache-hit != 'true' }}
      run: npm ci
    - name: Download check forecast
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: arc-check-forecast
        path: .
    - id: format-tables
      run: node --import tsx scripts/run-ci-checks.mjs run lint-typecheck format-tables
    - id: markdown-staged
      run: node --import tsx scripts/run-ci-checks.mjs run lint-typecheck markdown-staged
    - id: arc-triggers
      run: node --import tsx scripts/run-ci-checks.mjs run lint-typecheck arc-triggers
    - id: arc-domain-rules
      run: node --import tsx scripts/run-ci-checks.mjs run lint-typecheck arc-domain-rules
    - id: arc-section-refs
      run: node --import tsx scripts/run-ci-checks.mjs run lint-typecheck arc-section-refs
    - id: markdown
      run: node --import tsx scripts/run-ci-checks.mjs run lint-typecheck markdown
    - id: package-sync
      run: node --import tsx scripts/run-ci-checks.mjs run lint-typecheck package-sync
    - id: default
      run: node --import tsx scripts/run-ci-checks.mjs run lint-typecheck default
    - id: arc-contracts
      if: ${{ needs.classify.outputs.weight == 'light' }}
      run: node --import tsx scripts/run-ci-checks.mjs run lint-typecheck arc-contracts
    - if: ${{ needs.classify.outputs.weight != 'light' && needs.build.result == 'success' }}
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: arc-framework-dist
        path: packages/arc-framework/dist
    - id: runtime-preflight
      if: ${{ needs.classify.outputs.weight != 'light' }}
      run: node --import tsx packages/arc-framework/src/scripts/run-build.ts prepare
      env:
        ARC_E2E_SKIP_BUILD: ''
    - id: typescript-files
      if: ${{ needs.classify.outputs.weight != 'light' }}
      run: node --import tsx scripts/run-ci-checks.mjs run lint-typecheck typescript-files
    - id: typescript
      if: ${{ needs.classify.outputs.weight != 'light' }}
      run: node --import tsx scripts/run-ci-checks.mjs run lint-typecheck typescript
    - id: shell
      if: ${{ needs.classify.outputs.weight != 'light' }}
      run: node --import tsx scripts/run-ci-checks.mjs run lint-typecheck shell
    - id: typecheck
      if: ${{ needs.classify.outputs.weight != 'light' }}
      run: node --import tsx scripts/run-ci-checks.mjs run lint-typecheck typecheck
    - id: typecheck-tests
      if: ${{ needs.classify.outputs.weight != 'light' }}
      env:
        NODE_OPTIONS: --max-old-space-size=3072
      run: node --import tsx scripts/run-ci-checks.mjs run lint-typecheck typecheck-tests

  unit:
    name: Unit Tests (${{ matrix.shard }})
    permissions:
      contents: read
      actions: write # upload-artifact under workflow-level contents-only defaults
    needs: [classify, setup]
    if: ${{ !cancelled() && needs.classify.result == 'success' && needs.classify.outputs.duplicate_push != 'true' && (needs.classify.outputs.weight != 'light' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && needs.setup.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: ${{ vars.ARC_CI_LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
    - name: Start test budget clock
      run: echo "TEST_COST_STARTED_AT_SECONDS=$(date +%s)" >> "$GITHUB_ENV"
    - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      with:
        persist-credentials: false
    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
      with:
        node-version: 'lts/*'
        cache: 'npm'
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      id: nm-cache
      with:
        path: |
          node_modules
          packages/arc-framework/node_modules
        key: ${{ runner.os }}-${{ runner.arch }}-nm-${{ hashFiles('package-lock.json') }}
    - if: ${{ steps.nm-cache.outputs.cache-hit != 'true' }}
      run: npm ci
    - name: Download check forecast
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: arc-check-forecast
        path: .
    - name: Download duration input
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: test-duration-input
        path: packages/arc-framework/.test-cost-runs/duration-input/
    - name: Clear native test results
      run: rm -rf packages/arc-framework/node_modules/.vite/vitest/
    - name: Run balanced shard
      id: test
      run: >-
        node --import tsx scripts/run-ci-checks.mjs run unit test --shard ${{ matrix.shard }} -- --reporter=default --reporter=github-actions --reporter=json
        --outputFile=unit-test-report.json
      env:
        ARC_TEST_DURATION_FILE: ${{ github.workspace }}/packages/arc-framework/.test-cost-runs/duration-input/unit.json
    - name: Upload unit test report
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: unit-test-report-${{ matrix.shard }}
        path: packages/arc-framework/unit-test-report.json
        if-no-files-found: error
    - name: Upload native durations
      if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: duration-results-unit-${{ matrix.shard }}
        path: packages/arc-framework/node_modules/.vite/vitest/**/results.json
        include-hidden-files: true
        if-no-files-found: error
    - name: Report test budget
      run: >-
        npm run -s benchmark:test-cost:ci-budget -w packages/arc-framework --
        --tier unit --project-set unit --workers "${VITEST_MAX_WORKERS:-native}"
        --ci-job "unit-${{ matrix.shard }}" --started-at-seconds "$TEST_COST_STARTED_AT_SECONDS"

  integration:
    name: Integration Tests (${{ matrix.shard }})
    permissions:
      contents: read
      actions: write # download runtime and upload writer durations
    needs: [classify, setup, build]
    if: ${{ !cancelled() && needs.setup.result == 'success' && needs.build.result == 'success' && ((github.event_name == 'pull_request' && needs.classify.outputs.lane == 'reviewed' && needs.classify.outputs.weight != 'light') || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ${{ vars.ARC_CI_LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
    - name: Start test budget clock
      run: echo "TEST_COST_STARTED_AT_SECONDS=$(date +%s)" >> "$GITHUB_ENV"
    - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
      with:
        node-version: 'lts/*'
        cache: 'npm'
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      id: nm-cache
      with:
        path: |
          node_modules
          packages/arc-framework/node_modules
        key: ${{ runner.os }}-${{ runner.arch }}-nm-${{ hashFiles('package-lock.json') }}
    - if: ${{ steps.nm-cache.outputs.cache-hit != 'true' }}
      run: npm ci
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: arc-framework-dist
        path: packages/arc-framework/dist
    - name: Download check forecast
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: arc-check-forecast
        path: .
    - name: Download duration input
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: test-duration-input
        path: packages/arc-framework/.test-cost-runs/duration-input/
    - id: runtime-preflight
      run: node --import tsx packages/arc-framework/src/scripts/run-build.ts prepare
      env:
        ARC_E2E_SKIP_BUILD: ''
    - name: Clear native test results
      run: rm -rf packages/arc-framework/node_modules/.vite/vitest/
    - name: Run balanced shard
      id: test
      run: node --import tsx scripts/run-ci-checks.mjs run integration test --shard ${{ matrix.shard }}
      env:
        ARC_TEST_DURATION_FILE: ${{ github.workspace }}/packages/arc-framework/.test-cost-runs/duration-input/integration.json
        ARC_E2E_SKIP_BUILD: '1'
    - name: Upload native durations
      if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: duration-results-integration-${{ matrix.shard }}
        path: packages/arc-framework/node_modules/.vite/vitest/**/results.json
        include-hidden-files: true
        if-no-files-found: error
    - name: Report test budget
      run: >-
        npm run -s benchmark:test-cost:ci-budget -w packages/arc-framework --
        --tier integration --project-set integration --workers "${VITEST_MAX_WORKERS:-native}"
        --ci-job "integration-${{ matrix.shard }}" --started-at-seconds "$TEST_COST_STARTED_AT_SECONDS"

  e2e:
    name: E2E Tests (${{ matrix.shard }})
    permissions:
      contents: read
      actions: write # download runtime and upload writer durations
    needs: [classify, setup, build]
    if: ${{ !cancelled() && needs.setup.result == 'success' && needs.build.result == 'success' && ((github.event_name == 'pull_request' && needs.classify.outputs.lane == 'reviewed' && needs.classify.outputs.weight != 'light') || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ${{ vars.ARC_CI_LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
    - name: Start test budget clock
      run: echo "TEST_COST_STARTED_AT_SECONDS=$(date +%s)" >> "$GITHUB_ENV"
    - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      with:
        persist-credentials: false
    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
      with:
        node-version: 'lts/*'
        cache: 'npm'
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      id: nm-cache
      with:
        path: |
          node_modules
          packages/arc-framework/node_modules
        key: ${{ runner.os }}-${{ runner.arch }}-nm-${{ hashFiles('package-lock.json') }}
    - if: ${{ steps.nm-cache.outputs.cache-hit != 'true' }}
      run: npm ci
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: arc-framework-dist
        path: packages/arc-framework/dist
    - name: Download check forecast
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: arc-check-forecast
        path: .
    - name: Download duration input
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: test-duration-input
        path: packages/arc-framework/.test-cost-runs/duration-input/
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.x'
    - id: runtime-preflight
      run: node --import tsx packages/arc-framework/src/scripts/run-build.ts prepare
      env:
        ARC_E2E_SKIP_BUILD: ''
    - name: Clear native test results
      run: rm -rf packages/arc-framework/node_modules/.vite/vitest/
    - name: Run balanced shard
      id: test
      run: node --import tsx scripts/run-ci-checks.mjs run e2e test --shard ${{ matrix.shard }}
      env:
        ARC_TEST_DURATION_FILE: ${{ github.workspace }}/packages/arc-framework/.test-cost-runs/duration-input/e2e.json
        ARC_E2E_SKIP_BUILD: '1'
    - name: Upload native durations
      if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: duration-results-e2e-${{ matrix.shard }}
        path: packages/arc-framework/node_modules/.vite/vitest/**/results.json
        include-hidden-files: true
        if-no-files-found: error
    - name: Report test budget
      run: >-
        npm run -s benchmark:test-cost:ci-budget -w packages/arc-framework --
        --tier e2e --project-set e2e --workers "${VITEST_MAX_WORKERS:-native}"
        --ci-job "e2e-${{ matrix.shard }}" --started-at-seconds "$TEST_COST_STARTED_AT_SECONDS"

  merge-test-durations:
    name: Merge & save test durations
    permissions:
      contents: read
      actions: read
    needs: [unit, integration, e2e]
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && needs.unit.result == 'success' && needs.integration.result == 'success' && needs.e2e.result == 'success' }}
    runs-on: ${{ vars.ARC_CI_LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
    - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      with:
        persist-credentials: false
    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
      with:
        node-version: 'lts/*'
        cache: 'npm'
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      id: nm-cache
      with:
        path: |
          node_modules
          packages/arc-framework/node_modules
        key: ${{ runner.os }}-${{ runner.arch }}-nm-${{ hashFiles('package-lock.json') }}
    - if: ${{ steps.nm-cache.outputs.cache-hit != 'true' }}
      run: npm ci
    - name: Download writer durations
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        pattern: duration-results-*
        path: duration-results
    - name: Merge disjoint duration memberships
      run: node --import tsx packages/arc-framework/__tests__/helpers/merge-duration-input.ts duration-results packages/arc-framework/.test-cost-runs/duration-input
    - name: Save duration cache
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: packages/arc-framework/.test-cost-runs/duration-input
        key: arc-test-durations-Linux-${{ github.run_id }}

  # Linux confirmation for the same-machine write-safety guards. The
  # exclusive-create (`wx`/`O_EXCL`), advisory-lock (`mkdir` + `process.kill`
  # liveness), and CAS primitives - and the bounded true-race smoke that spawns
  # real concurrent writers - are OS-sensitive in a way the ubuntu-only jobs
  # above can't confirm. This required PR leg stays on Linux; the costlier
  # Windows/macOS confirmation below runs only when its focused surface changes.
  portability:
    name: Portability (concurrency guards) (linux)
    permissions:
      contents: read
      actions: read # download-artifact of shared dist
    needs: [classify, setup, build]
    if: ${{ !cancelled() && needs.setup.result == 'success' && needs.build.result == 'success' && ((github.event_name == 'pull_request' && needs.classify.outputs.lane == 'reviewed' && needs.classify.outputs.weight != 'light') || github.event_name == 'workflow_dispatch') }}
    runs-on: ${{ vars.ARC_CI_LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
    - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      with:
        persist-credentials: false
    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
      with:
        node-version: 'lts/*'
        cache: 'npm'
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      id: nm-cache
      with:
        path: |
          node_modules
          packages/arc-framework/node_modules
        key: ${{ runner.os }}-${{ runner.arch }}-nm-${{ hashFiles('package-lock.json') }}
    - if: ${{ steps.nm-cache.outputs.cache-hit != 'true' }}
      run: npm ci
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: arc-framework-dist
        path: packages/arc-framework/dist
    - name: Download check forecast
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: arc-check-forecast
        path: .
    - id: runtime-preflight
      run: node --import tsx packages/arc-framework/src/scripts/run-build.ts prepare
      env:
        ARC_E2E_SKIP_BUILD: ''
    - id: test
      run: node --import tsx scripts/run-ci-checks.mjs run portability test
      env:
        ARC_E2E_SKIP_BUILD: '1'

  # Cross-platform legs keep their own install+build: OS-native deps make a
  # Linux node_modules cache unusable on Windows/macOS (Pass 1 is Linux-only).
  # Schedule and explicit dispatch opt-in retain native install/build per OS.
  # Setup supplies the shared invocation forecast.
  portability-cross-platform:
    name: Portability targeted
    permissions:
      contents: read
      actions: read
    needs: setup
    # The Linux fleet capacity policy does not constrain hosted Windows/macOS.
    env:
      VITEST_MAX_WORKERS: ''
    if: ${{ needs.setup.result == 'success' && ((github.event_name == 'workflow_dispatch' && inputs.run_portability_pair) || github.event_name == 'schedule') }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      with:
        persist-credentials: false
    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
      with:
        node-version: 'lts/*'
        cache: 'npm'
    - run: npm ci
    - name: Download check forecast
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: arc-check-forecast
        path: .
    - id: build
      run: node --import tsx scripts/run-ci-checks.mjs run portability-cross-platform build
    - id: runtime-preflight
      run: node --import tsx packages/arc-framework/src/scripts/run-build.ts prepare
      env:
        ARC_E2E_SKIP_BUILD: ''
    - id: test
      run: node --import tsx scripts/run-ci-checks.mjs run portability-cross-platform test
      env:
        ARC_E2E_SKIP_BUILD: '1'
    - id: macos
      if: ${{ runner.os == 'macOS' }}
      run: node --import tsx scripts/run-ci-checks.mjs run portability-cross-platform macos
      env:
        ARC_E2E_SKIP_BUILD: '1'

  ci_ok:
    name: ci-ok
    permissions: {}
    needs: [classify, setup, build, lint-typecheck, unit, integration, e2e, portability, portability-cross-platform]
    if: ${{ always() && !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ${{ vars.ARC_CI_LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Roll up required jobs
        env:
          # Pass the whole needs graph as JSON (job id -> {result, outputs}) so the
          # rollup can name which job failed, not just that one did.
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          # Pass when every needed job succeeded OR was skipped; on failure, name
          # the offending job(s) so a red rollup is diagnosable from this check
          # alone, without opening each needed job's log.
          printf '%s' "$NEEDS_JSON" | jq -r 'to_entries[] | "needed job \(.key): \(.value.result)"'
          failed="$(printf '%s' "$NEEDS_JSON" \
            | jq -r 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key')"
          if [ -n "$failed" ]; then
            echo "::error::required job(s) did not succeed: $(printf '%s' "$failed" | paste -sd, -)"
            exit 1
          fi
          echo "ci-ok ✓ (lane=${{ needs.classify.outputs.lane }} weight=${{ needs.classify.outputs.weight }})"

  merge-ok:
    name: merge-ok
    permissions: {}
    needs: ci_ok
    if: ${{ always() && github.event_name == 'pull_request' }}
    runs-on: ${{ vars.ARC_CI_LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Mirror ci-ok for required-context compatibility
        env:
          CI_OK_RESULT: ${{ needs.ci_ok.result }}
        run: |
          if [ "$CI_OK_RESULT" != 'success' ]; then
            echo "::error::ci-ok did not succeed: $CI_OK_RESULT"
            exit 1
          fi
          echo 'merge-ok compatibility alias ✓'

  # Record that this pull-request run passed every heavy job on the code tree it
  # tested, so a later run of the same pull request that tests an identical tree
  # can run light. Only a heavy run records: a light run tested nothing. The save
  # is advisory, so this job stays out of ci-ok's needs and a failed or duplicate
  # save never reddens the required check. A pull request from a fork runs with
  # read-only cache access, where a save writes nothing, so only a same-repository
  # pull request records; a fork's pull request runs heavy on every push.
  record-verified-tree:
    name: Record verified tree
    permissions: {}
    needs: [classify, setup, build, lint-typecheck, unit, integration, e2e, portability]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && needs.classify.outputs.weight == 'heavy' && needs.classify.outputs.tested_tree != '' && needs.setup.result == 'success' && needs.build.result == 'success' && needs.lint-typecheck.result == 'success' && needs.unit.result == 'success' && needs.integration.result == 'success' && needs.e2e.result == 'success' && needs.portability.result == 'success' }}
    runs-on: ${{ vars.ARC_CI_LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
    - name: Write verified-tree marker
      env:
        TESTED_TREE: ${{ needs.classify.outputs.tested_tree }}
      run: printf '%s\n' "$TESTED_TREE" > .ci-verified-tree
    - name: Save verified-tree record
      continue-on-error: true
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: .ci-verified-tree
        key: ci-verified-tree-v1-pr${{ github.event.pull_request.number }}-${{ needs.classify.outputs.tested_tree }}
