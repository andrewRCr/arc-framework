name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

# Least-privilege default for the whole workflow: every job only reads the repo.
# Any job that later needs more requests it explicitly.
permissions:
  contents: read

jobs:
  # Classify the change on two independent axes:
  #   lane  - merge policy (auto-merge vs reviewed); see strategy-work-organization
  #           § Auto-Merge Lane. PR-only; logic unchanged from the original.
  #   depth - CI cost (light vs heavy). Heavy when the change touches code; light
  #           when it is documentation/markdown only, so a docs PR or a docs-only
  #           push skips the code suite, full-suite, and the portability matrix.
  # The axes are independent: a docs PR is reviewed-lane (no auto-merge) yet
  # light-depth. merge-ok rolls the gated jobs up into the single required check.
  classify:
    name: Classify lane
    runs-on: ubuntu-latest
    outputs:
      lane: ${{ steps.c.outputs.lane }}
      depth: ${{ steps.c.outputs.depth }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: c
        run: |
          # Two changed-file sets drive the two axes:
          #   changed_all   - the whole change (PR base...head, or push delta);
          #                   drives lane (merge policy).
          #   changed_depth - the latest push delta when resolvable, else the
          #                   whole change; drives depth (CI cost). Using the
          #                   latest push lets a docs-only push onto a code PR run
          #                   light: the code was already tested on its own push,
          #                   markdown can't change test outcomes, and the
          #                   reviewed lane still requires human/CR sign-off.
          #                   (Belt-and-suspenders "full-suite passed at least
          #                   once on the PR" enforcement is intentionally out of
          #                   scope here.)
          # Fail safe to heavy: any uncertainty (unverifiable SHAs, force-push,
          # empty diff) leaves depth=heavy, so code is never skipped as docs.
          event='${{ github.event_name }}'
          action='${{ github.event.action }}'

          if [ "$event" = 'pull_request' ]; then
            all_base='${{ github.event.pull_request.base.sha }}'
            all_head='${{ github.event.pull_request.head.sha }}'
          else
            all_base='${{ github.event.before }}'
            all_head='${{ github.sha }}'
          fi
          changed_all=''
          if git rev-parse -q --verify "$all_base^{commit}" >/dev/null 2>&1 \
             && git rev-parse -q --verify "$all_head^{commit}" >/dev/null 2>&1; then
            changed_all="$(git diff --name-only "$all_base...$all_head" 2>/dev/null || true)"
          fi

          # Latest-push delta for depth (synchronize or push). PR opened/reopened
          # has no prior head, so depth falls back to the whole change.
          push_before=''
          if [ "$event" = 'pull_request' ] && [ "$action" = 'synchronize' ]; then
            push_before='${{ github.event.before }}'
            push_after='${{ github.event.after }}'
          elif [ "$event" = 'push' ]; then
            push_before='${{ github.event.before }}'
            push_after='${{ github.sha }}'
          fi
          changed_depth="$changed_all"
          if [ -n "$push_before" ] \
             && git rev-parse -q --verify "$push_before^{commit}" >/dev/null 2>&1 \
             && git rev-parse -q --verify "$push_after^{commit}" >/dev/null 2>&1 \
             && git merge-base --is-ancestor "$push_before" "$push_after" 2>/dev/null; then
            changed_depth="$(git diff --name-only "$push_before..$push_after" 2>/dev/null || true)"
          fi

          echo 'changed (all):'; printf '%s\n' "$changed_all"
          echo 'changed (depth):'; printf '%s\n' "$changed_depth"

          # depth=light only when the depth set is non-empty and every file is *.md.
          depth=heavy
          if [ -n "$changed_depth" ] && ! printf '%s\n' "$changed_depth" | grep -qvE '\.md$'; then
            depth=light
          fi
          echo "depth=$depth" >> "$GITHUB_OUTPUT"

          # lane (PR only) from the WHOLE change: auto-merge lane = per-WU /
          # per-cohort planning artifacts only (PREFIX draft- / tasks- / meta- /
          # notes- / cohort-* under active/ or backlog/); else reviewed. Computed
          # from changed_all so a docs push never flips a code PR to auto-merge.
          lane=reviewed
          if [ "$event" = 'pull_request' ] && [ -n "$changed_all" ] \
             && ! printf '%s\n' "$changed_all" \
                  | grep -qvE '^\.arc/(active|backlog)/([^/]+/)*(draft|tasks|meta|notes|cohort)-'; then
            lane=auto
          fi
          echo "lane=$lane" >> "$GITHUB_OUTPUT"
          echo "classified lane=$lane depth=$depth (event=$event action=$action)"

  quality:
    name: Quality Checks
    needs: classify
    # Run on every push (feedback); on a PR, only the reviewed lane. The code
    # steps below additionally gate on depth (fail-safe: run unless explicitly
    # light), so a docs-only change runs just the documentation linters.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.classify.outputs.lane == 'reviewed') }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false
    - uses: actions/setup-node@v5
      with:
        node-version: 'lts/*'
        cache: 'npm'
    - run: npm ci
    # Documentation / ARC-doc linters - relevant to docs and code alike; always run.
    - run: npm run lint:arc:triggers
    - run: npm run lint:arc:domain-rules
    - run: npm run lint:arc:section-refs
    - run: npm run -s lint:md
    # Code checks - only when the change touches code (depth != light).
    - if: ${{ needs.classify.outputs.depth != 'light' }}
      run: npm run build
    - if: ${{ needs.classify.outputs.depth != 'light' }}
      run: npm run lint:ts
    - if: ${{ needs.classify.outputs.depth != 'light' }}
      run: npm run lint:sh
    - if: ${{ needs.classify.outputs.depth != 'light' }}
      run: npm run typecheck
    - if: ${{ needs.classify.outputs.depth != 'light' }}
      run: npm run typecheck:test
    - if: ${{ needs.classify.outputs.depth != 'light' }}
      run: npm run test:unit

  full-suite:
    name: Full Test Suite
    needs: classify
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.classify.outputs.lane == 'reviewed' && needs.classify.outputs.depth != 'light' }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false
    - uses: actions/setup-node@v5
      with:
        node-version: 'lts/*'
        cache: 'npm'
    - run: npm ci
    - run: npm run build
    - run: npm run test:integration
    - run: npm run test:e2e

  # Cross-platform confirmation for the same-machine write-safety guards. The
  # exclusive-create (`wx`/`O_EXCL`), advisory-lock (`mkdir` + `process.kill`
  # liveness), and CAS primitives - and the bounded true-race smoke that spawns
  # real concurrent writers - are OS-sensitive in a way the ubuntu-only jobs
  # above can't confirm. The rest of the pipeline stays ubuntu-only by design;
  # only this suite fans out across the three GitHub-hosted runner OSes (WSL is
  # Linux syscalls, covered by the ubuntu leg).
  portability:
    name: Portability (concurrency guards)
    needs: classify
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.classify.outputs.lane == 'reviewed' && needs.classify.outputs.depth != 'light' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false
    - uses: actions/setup-node@v5
      with:
        node-version: 'lts/*'
        cache: 'npm'
    - run: npm ci
    - run: npm run build
    - run: npm run test:portability

  merge-ok:
    name: merge-ok
    needs: [classify, quality, full-suite, portability]
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Roll up required jobs
        run: |
          # Pass when every needed job succeeded OR was skipped; fail otherwise.
          for r in ${{ join(needs.*.result, ' ') }}; do
            echo "needed job result: $r"
            case "$r" in
              failure|cancelled) echo "::error::a required job did not succeed"; exit 1 ;;
            esac
          done
          echo "merge-ok ✓ (lane=${{ needs.classify.outputs.lane }} depth=${{ needs.classify.outputs.depth }})"
