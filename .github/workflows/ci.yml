name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-node@v5
      with:
        node-version: 'lts/*'
        cache: 'npm'
    - run: npm ci
    - run: npm run build
    - run: npm run lint:arc:triggers
    - run: npm run lint:arc:domain-rules
    - run: npm run -s lint:md
    - run: npm run lint:ts
    - run: npm run lint:sh
    - run: npm run typecheck
    - run: npm run typecheck:test
    - run: npm run test:unit

  full-suite:
    name: Full Test Suite
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-node@v5
      with:
        node-version: 'lts/*'
        cache: 'npm'
    - run: npm ci
    - run: npm run build
    - run: npm run test:integration
    - run: npm run test:e2e
