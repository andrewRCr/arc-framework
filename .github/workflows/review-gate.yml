name: Review Gate

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, edited, labeled, unlabeled]
  status:
  workflow_run:
    workflows: [CI, Review Gate Wakeup]
    types: [completed]
  issue_comment:
    types: [created, edited]
  check_run:
    types: [completed, rerequested]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      pull_request:
        required: true
        type: number
      head_sha:
        required: true
        type: string

permissions:
  contents: read
  checks: read
  pull-requests: read
  statuses: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - id: discover
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./node_modules/.bin/tsx packages/arc-framework/src/scripts/review-gate/run-reconcile.ts discover

  reconcile:
    needs: discover
    if: ${{ needs.discover.outputs.matrix != '' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    concurrency:
      group: review-gate-${{ matrix.repositoryId }}-${{ matrix.pullRequestNumber }}
      cancel-in-progress: false
    environment: review-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.ARC_REVIEW_GATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.ARC_REVIEW_GATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-checks: write
          permission-pull-requests: write
          permission-statuses: read
      - env:
          ARC_REPOSITORY_ID: ${{ matrix.repositoryId }}
          ARC_PULL_REQUEST_NUMBER: ${{ matrix.pullRequestNumber }}
          ARC_REVIEW_GATE_APP_ID: ${{ vars.ARC_REVIEW_GATE_APP_ID }}
          ARC_APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: ./node_modules/.bin/tsx packages/arc-framework/src/scripts/review-gate/run-reconcile.ts reconcile
