name: Review Gate

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, edited, labeled, unlabeled,
      review_requested, review_request_removed]
  status:
  workflow_run:
    workflows: [CI, Review Gate Wakeup]
    types: [completed]
  issue_comment:
    types: [created, edited, deleted]
  check_run:
    types: [created, completed, rerequested]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      pull_request:
        required: true
        type: number
      head_sha:
        required: true
        type: string
      qualification_provider:
        required: false
        type: string
      qualification_guidance_digest:
        required: false
        type: string

permissions:
  contents: read
  checks: read
  pull-requests: read
  statuses: read

# Collapse wake-up event bursts (statuses, check runs, comment creation/edits,
# workflow completions, the repair cron): one run in progress, one pending;
# further events replace the pending run. Safe for these hint-class events —
# every discover pass re-queries canonical state, and a missed event only
# delays reconciliation until scheduled repair. Two classes are exempt via a
# per-run group and never collapse: targeted `workflow_dispatch` runs, and
# `issue_comment` deletions, whose bounded prior-body payload rides the event
# into the reconcile matrix and is unrecoverable from canonical re-query.
# Never cancels a running reconciliation.
concurrency:
  group: ${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'issue_comment' && github.event.action == 'deleted')) && format('review-gate-uncollapsed-{0}', github.run_id) || 'review-gate-events' }}
  cancel-in-progress: false

jobs:
  discover:
    permissions:
      contents: read
      checks: read
      pull-requests: read
      statuses: read
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - id: discover
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ARC_REVIEW_GATE_APP_ID: ${{ vars.ARC_REVIEW_GATE_APP_ID }}
        run: ./node_modules/.bin/tsx packages/arc-framework/src/scripts/review-gate/run-reconcile.ts discover

  reconcile:
    permissions:
      contents: read
      checks: read
      pull-requests: read
      statuses: read
    needs: discover
    if: ${{ needs.discover.outputs.matrix != '' && needs.discover.outputs.matrix != '{"include":[]}' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    concurrency:
      group: review-gate-${{ matrix.repositoryId }}-${{ matrix.pullRequestNumber }}
      cancel-in-progress: false
    environment: review-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.ARC_REVIEW_GATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.ARC_REVIEW_GATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-checks: write
          permission-pull-requests: write
          permission-statuses: read
      - env:
          ARC_REPOSITORY_ID: ${{ matrix.repositoryId }}
          ARC_PULL_REQUEST_NUMBER: ${{ matrix.pullRequestNumber }}
          ARC_REVIEW_GATE_APP_ID: ${{ vars.ARC_REVIEW_GATE_APP_ID }}
          REVIEW_GATE_CONTEXT_MODE: ${{ vars.REVIEW_GATE_CONTEXT_MODE }}
          ARC_APP_TOKEN: ${{ steps.app-token.outputs.token }}
          ARC_APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          ARC_TRIGGER_DELETION: ${{ toJSON(matrix.triggerDeletion) }}
          ARC_QUALIFICATION_MODE: ${{ inputs.qualification_provider != '' && 'live-provider-probe' || '' }}
          ARC_QUALIFICATION_PROVIDER: ${{ inputs.qualification_provider }}
          ARC_QUALIFICATION_GUIDANCE_DIGEST: ${{ inputs.qualification_guidance_digest }}
          GITHUB_TOKEN: ${{ github.token }}
        run: ./node_modules/.bin/tsx packages/arc-framework/src/scripts/review-gate/run-reconcile.ts reconcile
