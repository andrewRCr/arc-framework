name: Review Gate Wakeup

on:
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]

permissions: {}

# Collapse per-comment event bursts: one relay running, one pending per pull
# request; further events replace the pending relay. Safe because the relay is
# a pure wake-up hint — the controller re-queries canonical state, and a missed
# event only delays reconciliation until its scheduled repair. Never cancels a
# running relay.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  relay:
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Review state changed; privileged reconciliation will re-query canonical state.'
