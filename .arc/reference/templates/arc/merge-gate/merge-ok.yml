# merge-ok — the single required status check for the auto-merge lane.
#
# Branch protection requires ONLY the `merge-ok` check. The heavy jobs
# (build / lint / test) carry a lane filter and are NOT required directly:
# a required check that is filtered away never reports, stays "Expected /
# Pending", and blocks the merge forever. `merge-ok` instead runs on every PR,
# depends on the heavy jobs, and treats a lane-skipped job as success — so a
# planning-only PR (heavy jobs skipped) still gets a green required check and
# auto-merges, while a code / constitutional PR waits on the real jobs.
#
# GitHub `needs` is intra-workflow only, so the gate must live in the SAME
# workflow as the jobs it rolls up. Fold your real build/test steps into the
# `quality` placeholder below (or add this `classify` + `merge-ok` pair to your
# existing CI workflow and list every heavy job in `merge-ok.needs`).
#
# Doctrine: strategy-work-organization.md § Auto-Merge Lane. This recipe is
# GitHub-flavored; other hosts adapt the same three conditions (stable required
# check, owner-review on reviewed paths, native auto-merge).

name: merge-ok

on:
  pull_request:
    branches: [main] # your base branch

permissions:
  contents: read

jobs:
  classify:
    name: Classify lane
    runs-on: ubuntu-latest
    outputs:
      lane: ${{ steps.lane.outputs.lane }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: lane
        name: Resolve auto-merge vs reviewed lane
        run: |
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          changed="$(git diff --name-only "$base...$head")"
          echo "changed paths:"; printf '%s\n' "$changed"
          # Auto-merge lane = per-WU / per-cohort planning artifacts only,
          # matched by PREFIX (not by folder): draft- / tasks- / meta- / notes- /
          # cohort-* under active/ or backlog/. Any other changed path — code, a
          # design doc (spec- / prd-), a constitutional doc (rule, ADR, strategy),
          # or a derived / shared surface (ROADMAP, the backlog inboxes) — puts the
          # whole PR on the reviewed lane; the lanes never split a single PR.
          if printf '%s\n' "$changed" \
            | grep -qvE '^\.arc/(active|backlog)/([^/]+/)*(draft|tasks|meta|notes|cohort)-'; then
            echo "lane=reviewed" >> "$GITHUB_OUTPUT"
          else
            echo "lane=auto" >> "$GITHUB_OUTPUT"
          fi

  quality:
    name: Quality Checks
    needs: classify
    if: ${{ needs.classify.outputs.lane == 'reviewed' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: echo "replace with your real build / lint / typecheck / test steps"

  merge-ok:
    name: merge-ok # <- the one check to mark "Required" in branch protection
    needs: [classify, quality] # list every heavy job here
    if: ${{ !cancelled() }} # run even when the heavy jobs were lane-skipped
    runs-on: ubuntu-latest
    steps:
      - name: Roll up required jobs
        run: |
          # Pass when every needed job succeeded OR was skipped; fail otherwise.
          for r in ${{ join(needs.*.result, ' ') }}; do
            echo "needed job result: $r"
            case "$r" in
              failure|cancelled) echo "::error::a required job did not succeed"; exit 1 ;;
            esac
          done
          echo "merge-ok ✓ (lane=${{ needs.classify.outputs.lane }})"
