# ARC Framework Configuration
#
# Project-level settings for ARC conventions.
# Only conventions (tier 2) appear here — principles (tier 1) are non-negotiable.
#
# Classified as Configurable — framework updates may add new settings;
# your customizations are preserved via three-way merge.
#
# Format: Flat key-value pairs with dotted grouping. Parsed by githooks using
# line-based shell matching (grep + cut) — no nested structures.

# --- Branch Model ---

# The primary integration branch.
# All planned work branches are created from and merged back to this branch.
branch.base: main

# Branch protection level.
#   partial - Planned work requires branches. Atomic tasks and backlog
#             capture may commit directly to the base branch. (default)
#   full    - All changes require branches and PR review.
# See strategy-work-organization.md § Branch Protection Modes.
branch.protection: full

# --- Commit Discipline ---

# Commit message format enforced by commit-msg hook.
#   conventional - type(scope): description (default)
#   custom       - validates against commit.custom_pattern regex
#   any          - no format validation
commit.format: conventional

# Context footer requirement enforced by commit-msg hook.
#   required    - Context: line must be present and valid (default)
#   recommended - warns if missing, does not block
#   custom      - validates against commit.context_pattern regex
#   disabled    - no context footer validation
commit.context_footer: required

# Custom commit format regex (used when commit.format: custom).
# Examples:
#   "^\[?[A-Z]+-[0-9]+\]? .+"              — Jira prefix
#   "^[A-Z]+-[0-9]+ (feat|fix|chore): .+"  — ticket + type
commit.custom_pattern:

# Custom context footer regex (used when commit.context_footer: custom).
# Examples:
#   "^(Closes|Fixes|Relates to) [A-Z]+-[0-9]+"  — Jira reference
#   "^#[0-9]+ .+"                                 — GitHub issue
commit.context_pattern:

# --- Merge Strategy ---

# How branches are integrated into the base branch.
#   merge  - Merge commits preserve branch topology (default, most traceable)
#   rebase - Linear history, commits replayed onto base
#   squash - Single commit per branch (traceability shifts to PR descriptions)
# See strategy-configurability-architecture.md § Settings with behavioral implications.
merge.strategy: merge

# --- Hooks ---

# Pre-commit hook.
#   enabled  - Runs all pre-commit checks (default)
#   disabled - Skips pre-commit validation
hooks.pre_commit: enabled

# Commit-msg hook.
#   enabled  - Validates commit message format and context footer (default)
#   disabled - Skips commit message validation
hooks.commit_msg: enabled

# Task numbering format check in pre-commit hook.
# Per strategy-task-list-formatting.md: third level uses letters (1.1.a not 1.1.1).
#   error   - Block commit on violations (default)
#   warning - Warn but allow commit
#   off     - Skip check entirely
hooks.task_numbering: error

# File extensions skipped during meta-project reference checking.
# The pre-commit hook scans all staged files except those matching these
# extensions (and binary files, which are skipped automatically).
# Pipe-separated regex alternation.
#   default: md|yml|yaml|json|toml|txt|csv|lock|conf|cfg|ini|env|license|makefile
hooks.skip_extensions: md|yml|yaml|json|toml|txt|csv|lock|conf|cfg|ini|env|license|makefile

# Test directory/file patterns excluded from meta-project reference checking.
# Files matching these patterns are not production code and may legitimately
# reference tasks, phases, or .arc/ paths. Pipe-separated regex alternation.
#   default: __tests__/|\.test\.|\.spec\.|/test/|/tests/
hooks.test_patterns: __tests__/|\.test\.|\.spec\.|/test/|/tests/|docs/demos/

# Patterns scanned in production code for meta-project references.
# The pre-commit hook flags files matching these patterns as errors.
# Reduce to remove checks that cause false positives for your project
# (e.g., tooling that legitimately operates on .arc/ paths).
# Pipe-separated regex alternation.
#   default: '[Tt]ask [0-9]+\.[0-9]+|[Pp]hase [0-9]+|\.arc/'
hooks.meta_ref_patterns: '[Tt]ask [0-9]+\.[0-9]+|[Pp]hase [0-9]+'

# Subject line length thresholds for commit-msg hook.
# Defaults account for conventional commit prefix overhead (8-15 chars).
# Max aligns with GitHub's truncation point (72 chars).
# Skipped entirely when commit.format: any.
#   default max: 72, default warn: 60
hooks.subject_max_length: 72
hooks.subject_warn_length: 60

# Directories under .arc/ that trigger a warning when staged by contributors.
# Contributors typically work on project code, not maintainer-managed ARC
# artifacts. Soft warning only (does not block commit).
# Pipe-separated regex alternation matching paths under .arc/.
#   default: active/|backlog/
hooks.contributor_protected_paths: active/|backlog/

# --- Review ---

# Pre-merge diff review before push.
# Controls whether the agent reviews the aggregate diff before pushing.
# The diff-review method (arc-methods.md) defines the review activity;
# this setting gates the integrate-work-unit invocation of it.
#   enabled  - Agent reviews aggregate diff before pushing (default)
#   disabled - Skip local review; rely on PR-time review only
review.pre_merge: enabled

# --- Platform ---

# Git hosting platform.
# Informational — read by agent for context, not consumed by hooks.
# Affects which CLI commands the agent suggests (gh, glab, etc.).
# See QUICK-REFERENCE for platform-specific command alternatives.
#   github (default) | gitlab | bitbucket | azure-devops
platform.type: github

# --- Project Management ---

# Project Management (PM) mode. Controls where project management lives.
#   none       - Core methodology only. No PM artifacts installed. (default)
#   arc-in-git - ARC's built-in PM suite (backlogs, roadmap, PROJECT-STATUS, ATOMIC-TASKS)
#   external   - External tool integration (Jira, Linear, GitHub Issues, etc.)
# See strategy-configurability-architecture.md § Adoption flexibility model.
pm.mode: arc-in-git

# --- Team Mode ---

# Team mode. Controls behavioral defaults for multi-developer collaboration.
# Behavioral, not structural — the user/{identity}/ directory layout is
# identical in solo and team modes. Team mode affects:
#   - user.sync_push default (solo: always, team: prompt)
#   - Team coordination guidance (task ownership, handoff conventions)
#   false - Solo mode. Single developer, auto-sync session context. (default)
#   true  - Team mode. Multiple developers, conscious sync decisions.
# See strategy-team-coordination.md for the full coordination protocol.
team.mode: false

# --- User Directory ---

# Automatic push of user/{identity}/ directory via git notes.
# Controls whether `arc session push` runs automatically after handoff.
#   always - Push session state automatically after every handoff. (default)
#   prompt - Ask whether to push after handoff.
#   manual - Never auto-push; user runs `arc session push` explicitly.
# Per-developer override: `git config arc.syncPush <value>`
user.sync_push: always
