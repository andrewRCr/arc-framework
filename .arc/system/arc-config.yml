# ARC Framework Configuration
#
# Project-level settings for ARC conventions.
# Only conventions (tier 2) appear here — principles (tier 1) are non-negotiable.
#
# Classified as Configurable — framework updates may add new settings;
# your customizations are preserved via three-way merge.
#
# Format: Flat key-value pairs with dotted grouping. Parsed by githooks using
# line-based shell matching (grep + cut) — no nested structures.
#
# Personal preferences (autonomy cadence, release-wrapper opt-in) live in git-config local.
# See strategy-configurability-architecture.md § Personal Configuration via Git Config for
# the per-developer key reference.

# --- Branch Model ---

# The primary integration branch.
# All planned work branches are created from and merged back to this branch.
branch.base: main

# Branch protection level.
#   partial - Planned work requires branches. Atomic tasks and backlog
#             capture may commit directly to the base branch. (default)
#   full    - All changes require branches and PR review.
# See strategy-work-organization.md § Branch Protection Modes.
branch.protection: full

# --- Worktree ---

# Filesystem location template for ARC-created linked worktrees.
# Resolved at worktree-creation time: {repo} is the repository name, {name} is
# the work-unit name, and {branch} is the branch with slashes slugged to `-`
# (plan/foo -> plan-foo).
#   default: ../{repo}.{name}     - flat sibling of the primary checkout
# Override examples:
#   .worktrees/{name}             - nested inside the repo
#   ../worktrees/{repo}/{branch}  - branch-labeled centralized worktree parent dir
#   ~/worktrees/{repo}.{branch}   - branch-labeled home-rooted grouping
# Applies only to worktrees ARC creates; external worktrees are read from
# `git worktree list` as-is and never relocated. The resolved path is a
# creation-time artifact: a later branch rename does not move it. Branch-token
# slug collisions (plan/foo and plan-foo both map to plan-foo) are
# creation-time, last-write-wins / user-resolved.
worktree.location_template: ../{repo}.{name}

# Optional post-create provisioning script for ARC-created linked worktrees.
# Runs inside the new worktree after `git worktree add` and before ARC uses
# that checkout for follow-on work. Leave empty to surface a deps-provisioning
# notice instead of silently doing nothing.
worktree.post_create: bash scripts/worktree-post-create.sh

# Comma-separated list of top-level gitignored harness directories to copy
# from the primary checkout into ARC-created linked worktrees. ARC copies only
# entries that exist on the primary checkout and skips absent entries.
worktree.harness_dirs: .claude,.codex,.gemini,.opencode

# --- Commit Discipline ---

# Commit message format enforced by commit-msg hook.
#   conventional - type(scope): description (default)
#   custom       - validates against commit.custom_pattern regex
#   any          - no format validation
commit.format: conventional

# Context footer requirement enforced by commit-msg hook.
#   required    - Context: line must be present and valid (default)
#   recommended - warns if missing, does not block
#   custom      - validates against commit.context_pattern regex
#   disabled    - no context footer validation
commit.context_footer: required

# Custom commit format regex (used when commit.format: custom).
# Examples:
#   "^\[?[A-Z]+-[0-9]+\]? .+"              — Jira prefix
#   "^[A-Z]+-[0-9]+ (feat|fix|chore): .+"  — ticket + type
commit.custom_pattern:

# Custom context footer regex (used when commit.context_footer: custom).
# Examples:
#   "^(Closes|Fixes|Relates to) [A-Z]+-[0-9]+"  — Jira reference
#   "^#[0-9]+ .+"                                 — GitHub issue
commit.context_pattern:

# --- Merge Strategy ---

# How branches are integrated into the base branch.
#   merge  - Merge commits preserve branch topology (default, most traceable)
#   rebase - Linear history, commits replayed onto base
#   squash - Single commit per branch (traceability shifts to PR descriptions)
# See strategy-configurability-architecture.md § Settings with behavioral implications.
merge.strategy: merge

# --- Hooks ---

# Pre-commit hook.
#   enabled  - Runs all pre-commit checks (default)
#   disabled - Skips pre-commit validation
hooks.pre_commit: enabled

# Commit-msg hook.
#   enabled  - Validates commit message format and context footer (default)
#   disabled - Skips commit message validation
hooks.commit_msg: enabled

# Pre-push hook.
#   enabled  - Advisory warning before a force-push that rewrites published
#              history; never blocks the push (default)
#   disabled - Skips the force-push advisory
hooks.pre_push: enabled

# Task numbering format check in pre-commit hook.
# Per strategy-task-list-formatting.md: third level uses letters (1.1.a not 1.1.1).
#   error   - Block commit on violations (default)
#   warning - Warn but allow commit
#   off     - Skip check entirely
hooks.task_numbering: error

# File extensions skipped during meta-project reference checking.
# The pre-commit hook scans all staged files except those matching these
# extensions (and binary files, which are skipped automatically).
# Pipe-separated regex alternation.
#   default: md|yml|yaml|json|toml|txt|csv|lock|conf|cfg|ini|env|license|makefile
hooks.skip_extensions: md|yml|yaml|json|toml|txt|csv|lock|conf|cfg|ini|env|license|makefile

# Test directory/file patterns excluded from BROAD meta-project reference
# checking (see hooks.meta_ref_patterns below). Files matching these patterns
# may legitimately contain task / phase / artifact-name strings as fixture data
# (e.g., commit-footer parsers). The STRICT patterns below still apply to test
# files. Pipe-separated regex alternation.
#   default: __tests__/|\.test\.|\.spec\.|/test/|/tests/
hooks.test_patterns: __tests__/|\.test\.|\.spec\.|/test/|/tests/|docs/demos/

# Strict meta-project reference patterns scanned in ALL staged code, including
# tests. These cover patterns rare enough in legitimate fixture data that the
# test exemption is unsafe — PRD R-codes, bare requirement / behavior numeric
# IDs, and section-symbol citations. PROJECT-PRD lines are filtered as a known
# false positive (real framework template filename). Pipe-separated regex.
#   default: 'PRD R[0-9]+|\b[RB][0-9]+\b|§ '
hooks.strict_meta_ref_patterns: 'PRD R[0-9]+|\b[RB][0-9]+\b|§ '

# Broad meta-project reference patterns scanned in production code only — test
# files (see hooks.test_patterns) are exempted because parser tests legitimately
# consume task / phase / artifact-name strings as fixture input.
# Reduce to remove checks that cause false positives for your project (e.g.,
# tooling that legitimately operates on .arc/ paths). Pipe-separated regex.
#   default: '[Tt]ask [0-9]+\.[0-9]+|[Pp]hase [0-9]+|\.arc/|(tasks|plan|prd|status|notes|atomic)-[a-z][a-z0-9-]+\.md'
# This project's override drops the `\.arc/` pattern: framework code legitimately
# operates on .arc/ paths (status-file resolvers, classification, etc.).
hooks.meta_ref_patterns: '[Tt]ask [0-9]+\.[0-9]+|[Pp]hase [0-9]+|(tasks|plan|prd|status|notes|atomic)-[a-z][a-z0-9-]+\.md'

# Subject line hard limit for commit-msg hook.
# Aligns with GitHub's truncation point and `git log --oneline` width.
# Skipped entirely when commit.format: any.
#   default: 72
hooks.subject_max_length: 72

# Body runaway backstops for commit-msg hook. Authorial discipline aims at
# ~72-char wrap; these limits catch accidental paste / forgotten wrap, not
# style. Past either, the commit is usually better split or moved to a doc.
#   defaults: 100 lines, 100 chars per line
hooks.body_max_lines: 100
hooks.body_max_line_length: 100

# Directories under .arc/ that trigger a warning when staged by contributors.
# Contributors typically work on project code, not maintainer-managed ARC
# artifacts. Soft warning only (does not block commit).
# Pipe-separated regex alternation matching paths under .arc/.
#   default: active/|backlog/
hooks.contributor_protected_paths: active/|backlog/

# --- Review ---

# Pre-merge diff review before push.
# Controls whether the agent reviews the aggregate diff before pushing.
# The diff-review method (system/methods/diff-review.md) defines the review activity;
# this setting gates the integrate-work-unit invocation of it.
#   enabled  - Agent reviews aggregate diff before pushing (default)
#   disabled - Skip local review; rely on PR-time review only
review.pre_merge: enabled

# --- Platform ---

# Git hosting platform.
# Informational — read by agent for context, not consumed by hooks.
# Affects which CLI commands the agent suggests (gh, glab, etc.).
# See QUICK-REFERENCE for platform-specific command alternatives.
#   github (default) | gitlab | bitbucket | azure-devops
platform.type: github

# --- Project Management ---

# Project Management (PM) mode. Controls where project management lives.
#   none       - Core methodology only. No PM artifacts installed. (default)
#   arc-in-git - ARC's built-in PM suite (backlogs, roadmap, ATOMIC-TASKS)
#   external   - External tool integration (Jira, Linear, GitHub Issues, etc.)
# See strategy-configurability-architecture.md § Adoption flexibility model.
pm.mode: arc-in-git

# --- Team Mode ---

# Team mode. Controls behavioral defaults for multi-developer collaboration.
# Behavioral, not structural — the user/{identity}/ directory layout is
# identical in solo and team modes. Team mode affects:
#   - user.notes_push default (solo: on-sync, team: prompt)
#   - Team coordination guidance (task ownership, handoff conventions)
#   false - Solo mode. Single developer, auto-sync session context. (default)
#   true  - Team mode. Multiple developers, conscious sync decisions.
# See strategy-team-coordination.md for the full coordination protocol.
team.mode: false

# --- Session Initialization ---

# Automatic remote notes probe during session initialization.
# Controls whether session-init may fetch/probe remote note state automatically.
# Pulling user directory content into local files remains explicitly user-confirmed.
#   enabled  - Session-init may inspect remote notes state automatically. (default)
#   disabled - Skip remote notes probing during session-init.
session.remote_sync: enabled

# Worktree pull policy at session init when the local branch is behind origin.
#   manual - Surface the drift in orientation; user pulls when ready.
#   prompt - Prompt before pulling. (default)
# `always` is rejected for this channel — auto-pulling tracked working-tree
# state silently is too invasive even on clean trees.
# See session-init.md § Conditional Sync Pulls for dirty-tree precheck and prompt behavior.
session.init_pull.worktree: prompt

# Notes pull policy at session init when the remote notes ref is ahead.
#   manual - Surface the drift in orientation; user runs `arc user pull` when ready.
#   prompt - Prompt before pulling. (default)
#   always - Pull automatically (notes are gitignored personal context only).
# See session-init.md § Conditional Sync Pulls for combined-prompt and post-pull re-probe behavior.
session.init_pull.notes: prompt

# Base-branch pull policy at session init when the local base ref (`branch.base`)
# is behind its remote counterpart — a silently-stale local base on a returning
# clone. Fast-forward-only; never resolves a diverged base.
#   manual - Surface the staleness in orientation; user fast-forwards when ready.
#   prompt - Prompt before fast-forwarding. (default)
#   always - Fast-forward automatically when fast-forwardable (refused on a dirty tree).
# See session-init.md § Conditional Sync Pulls for the base-ref pull behavior.
session.init_pull.base: always

# Notes load policy at session init when the local notes ref is current but the
# user-directory working files are stale relative to the latest local note (the
# cross-machine resume gap — fetch advanced the ref while disk stayed behind).
#   manual - Surface the load action in orientation; user runs `arc user load` when ready.
#   prompt - Prompt before loading. (default)
#   always - Load automatically (the pre-load backup snapshot is the safety net).
# See session-init.md § Conditional Sync Pulls for the load cascade and dirty-tree refusal under `always`.
session.init_load.notes: prompt

# --- User Directory ---

# Automatic push of user/{identity}/ directory via git notes.
# Controls whether `arc sync` pushes user notes after saving them.
#   manual  - Never auto-push; user runs `arc user push` explicitly.
#   prompt  - Ask whether to push user notes when `arc sync` runs.
#   on-sync - Push user notes whenever `arc sync` runs. (default)
# Per-developer override: `git config arc.notesPush <value>`
user.notes_push: on-sync

# --- Sync ---

# Inbound fast-forward on `arc sync` when the worktree is behind origin
# (remote-ahead). Fast-forward-only; never resolves a diverged worktree and
# refuses a dirty tree. Interactive runs (a TTY) always fast-forward — `arc sync`
# is the explicit invocation and the result is visible. This flag governs the
# non-interactive (agent) path only:
#   false - Surface the drift; do not pull. Protects an agent's working tree from
#           a silent mid-task mutation. (default)
#   true  - Fast-forward automatically under a non-TTY too.
sync.auto_pull: false

# --- Archival ---

# Work-unit archival cadence after merge.
#   with-integration - Run archive ops with integration follow-through as a
#                      separate commit in the integration PR. (default)
#   manual           - Defer archival until explicitly invoked.
archive.cadence: with-integration

# --- Inbox ---

# Reminder threshold, in whole days, for flagged USER-INBOX captures. A `_Remind:_`-flagged
# `§ Errand` entry surfaces a session-init nudge once its capture date is this many days old
# (floor: never the same day). Conceptually a per-user preference; lives here today, migrating
# to a per-user config substrate later.
inbox.remind_after_days: 1

# --- Integration ---

# Staleness threshold, in whole days, for an owned work unit sitting in
# `Integrating` (awaiting review). Once a WU's branch tip is this many days old
# it surfaces as a batched session-init `stale` nudge (once per calendar day).
# The actionable events — a mergeable or merged-needs-archival WU — bypass this
# threshold and surface immediately. Conceptually a per-user preference; lives
# here today, migrating to a per-user config substrate later.
integration.stale_after_days: 2
